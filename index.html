<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>원고별 검토 메모</title>
<style>
:root{--navy:#1f3864;--bg:#f5f6f8;--line:#d9dde3;--muted:#667}
*{box-sizing:border-box}body{margin:0;font-family:"맑은 고딕","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:#1d2330;font-size:15px;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header b{font-size:16px}header a{color:#fff;text-decoration:none;font-size:14px;opacity:.9}
main{max-width:900px;margin:0 auto;padding:14px}
.lock{max-width:360px;margin:18vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;text-align:center}
.lock input{width:100%;font-size:17px;padding:10px;border:1px solid var(--line);border-radius:8px;margin:12px 0}
.lock button,.btn{font-size:16px;padding:10px 16px;border:0;border-radius:8px;background:var(--navy);color:#fff}
.err{color:#b42318;min-height:1.4em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{display:block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:inherit}
.card .who{font-size:18px;font-weight:700;color:var(--navy)}.card .t{font-size:13.5px;color:var(--muted)}.card .n{float:right;font-weight:700;color:#b42318}
.sec{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
h2.page{font-size:20px;color:var(--navy);margin:6px 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:6px}
details>summary{cursor:pointer;font-weight:700;color:var(--navy);padding:6px 0}
.tw{overflow-x:auto;margin:6px 0 10px}table{border-collapse:collapse;min-width:100%;font-size:13px}td{border:1px solid var(--line);padding:5px 6px;vertical-align:top}
td[bgcolor]{background:#e6ebf3}p{margin:0 0 6px}
.nav{display:flex;justify-content:space-between;gap:8px;margin:14px 0}.nav a{flex:1;text-align:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px;text-decoration:none;color:var(--navy);font-weight:700}
.note{font-size:12.5px;color:var(--muted)}
</style></head><body>
<header><b>원고별 검토 메모</b><span style="flex:1"></span><a href="#">목록</a><a href="#agenda">협의회 안건</a></header>
<main id="app"><div class="lock"><div style="font-weight:700;font-size:17px">비밀번호를 넣어 주세요</div>
<input id="pw" type="password" autocomplete="current-password" inputmode="text"><div class="err" id="err"></div><button id="go">열기</button>
<p class="note">개인 검토용 자료입니다. 주소를 다른 사람에게 보내지 마세요.</p></div></main>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let D=null;
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(META.salt),iterations:META.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const u=b64(META.data);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k,u.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryOpen(pw){
  document.getElementById('err')&&(document.getElementById('err').textContent='여는 중…');
  try{D=await unlock(pw);try{sessionStorage.setItem('rwwpw',pw)}catch(e){}render();}
  catch(e){const el=document.getElementById('err');if(el)el.textContent='비밀번호가 맞지 않습니다.';}
}
function render(){
  if(!D)return;const app=document.getElementById('app');const h=location.hash.slice(1);
  const i=D.docs.findIndex(d=>d.id===h);
  if(h==='agenda'){app.innerHTML='<h2 class="page">협의회에서 정할 것</h2><div class="sec">'+D.agenda+'</div><div class="sec"><details><summary>아침에 볼 것(요약)</summary>'+D.intro+'</details></div>';scrollTo(0,0);return;}
  if(i<0){app.innerHTML='<p class="sub">'+D.made+' · 이름을 누르면 그 원고에서 고칠 것을 봅니다.</p><div class="grid">'+D.docs.map(d=>'<a class="card" href="#'+d.id+'"><span class="n">꼭 '+d.count+'</span><div class="who">'+d.who+'</div><div class="t">'+d.title+'</div></a>').join('')+'</div><p style="margin-top:14px"><a class="btn" href="#agenda" style="text-decoration:none">협의회 안건 10가지 보기</a></p>';scrollTo(0,0);return;}
  const d=D.docs[i],p=D.docs[i-1],n=D.docs[i+1];
  app.innerHTML='<h2 class="page">'+d.who+'</h2><div class="sub">'+d.title+'</div><div class="sec">'+d.top+'</div><div class="sec"><details><summary>자세한 검토(1차 재검증·새 의견·그림·사실 확인 출처)</summary>'+d.detail+'</details></div><div class="nav">'+(p?'<a href="#'+p.id+'">◀ '+p.who+'</a>':'<span></span>')+(n?'<a href="#'+n.id+'">'+n.who+' ▶</a>':'<span></span>')+'</div>';
  scrollTo(0,0);
}
